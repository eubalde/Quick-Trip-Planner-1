kind = "mobile"
previewPath = "/"
title = "AI Travel Itinerary Planner"
version = "1.0.0"
id = "artifacts/travel-planner"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 24400

[services.development]
run = "pnpm --filter @workspace/travel-planner run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/travel-planner", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/travel-planner", "run", "serve" ]

[services.env]
PORT = "24400"
BASE_PATH = "/"
